<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="hillsFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="hillsNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#cloudSky)" />

  <!-- Soft Sunset Dream Orb -->
  <circle cx="300" cy="280" r="120" fill="#fef08a" opacity="0.4" />

  <!-- Background Rolling Dream Hills -->
  <path d="M-50 480 Q 120 400 300 450 T 650 430 L650 600 L-50 600 Z" fill="url(#hillsFar)" opacity="0.6" />
  <path d="M-50 520 Q 180 460 380 500 T 650 480 L650 600 L-50 600 Z" fill="url(#hillsNear)" />

  <!-- Cloud 1: Main Fluffy Parade Cloud with Sleepy Happy Face -->
  <g transform="translate(140, 160)">
    <path d="M 60 120 Q 30 120 20 90 Q 0 60 30 30 Q 60 0 100 20 Q 140 -10 190 10 Q 230 0 250 30 Q 280 40 280 80 Q 290 120 250 130 Q 220 140 180 130 Z" fill="url(#cloudGrad1)" filter="drop-shadow(0 12px 24px rgba(99, 102, 241, 0.25))" />
    <!-- Cute Sleepy Eyes -->
    <path d="M 110 70 Q 120 80 130 70" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 170 70 Q 180 80 190 70" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Little Rosy Cheeks -->
    <ellipse cx="102" cy="78" rx="8" ry="5" fill="#f472b6" opacity="0.5" />
    <ellipse cx="198" cy="78" rx="8" ry="5" fill="#f472b6" opacity="0.5" />
    <!-- Happy Smile -->
    <path d="M 145 84 Q 150 90 155 84" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Baby Cloud floating alongside -->
  <g transform="translate(380, 260) scale(0.65)">
    <path d="M 50 100 Q 20 100 10 70 Q 0 40 40 20 Q 80 -10 130 10 Q 170 0 190 30 Q 210 50 200 90 Q 180 110 140 105 Z" fill="url(#cloudGrad2)" filter="drop-shadow(0 8px 16px rgba(244, 114, 182, 0.25))" />
    <path d="M 80 55 Q 90 62 100 55" stroke="#be185d" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 130 55 Q 140 62 150 55" stroke="#be185d" stroke-width="3" stroke-linecap="round" fill="none" />
    <ellipse cx="75" cy="62" rx="6" ry="4" fill="#fb7185" opacity="0.5" />
    <ellipse cx="155" cy="62" rx="6" ry="4" fill="#fb7185" opacity="0.5" />
  </g>

  <!-- Little Stardust Stars and Hearts floating -->
  <polygon points="120,100 123,108 132,109 125,115 127,123 120,118 113,123 115,115 108,109 117,108" fill="#fef08a" />
  <polygon points="460,110 462,116 469,117 464,121 465,128 460,124 455,128 456,121 451,117 458,116" fill="#fef08a" />
  <circle cx="280" cy="90" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="340" cy="110" r="3" fill="#ffffff" opacity="0.7" />
</svg>
