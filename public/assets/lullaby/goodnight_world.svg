<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceCosmos" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="45%" stop-color="#0e0a1f" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="earthOceans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cradleMoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Night -->
  <rect width="600" height="600" rx="32" fill="url(#spaceCosmos)" />

  <!-- Cosmic Nebula Bloom -->
  <circle cx="320" cy="300" r="240" fill="url(#nebulaGlow)" />

  <!-- Twinkling Starfield -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="1.5" opacity="0.8" />
    <circle cx="160" cy="140" r="2.5" opacity="0.9" />
    <circle cx="240" cy="70" r="1.5" opacity="0.6" />
    <circle cx="360" cy="90" r="2" opacity="0.9" />
    <circle cx="480" cy="120" r="3" opacity="0.95" />
    <circle cx="530" cy="220" r="1.5" opacity="0.7" />
    <circle cx="500" cy="400" r="2" opacity="0.8" />
    <circle cx="430" cy="510" r="2.5" opacity="0.85" />
    <circle cx="120" cy="480" r="2" opacity="0.75" />
    <circle cx="70" cy="330" r="1.5" opacity="0.6" />
    <circle cx="180" cy="260" r="3" opacity="0.9" />
  </g>

  <!-- Golden Crescent Moon Cradle -->
  <path d="M 180 180 A 170 170 0 1 0 460 420 A 135 135 0 1 1 230 200 Z" fill="url(#cradleMoon)" filter="drop-shadow(0 0 20px rgba(245, 158, 11, 0.4))" />

  <!-- Sleeping Baby Earth nested inside the crescent moon -->
  <g transform="translate(290, 290)">
    <!-- Earth Globe -->
    <circle cx="0" cy="0" r="110" fill="url(#earthOceans)" filter="drop-shadow(0 0 25px rgba(56, 189, 248, 0.4))" />
    
    <!-- Peaceful Continents (Green storybook shapes) -->
    <path d="M -60 -40 Q -30 -70 20 -50 Q 50 -20 30 10 Q -10 20 -40 -10 Z" fill="#4ade80" opacity="0.9" />
    <path d="M -20 20 Q 30 30 50 60 Q 20 80 -10 70 Q -40 50 -20 20 Z" fill="#4ade80" opacity="0.9" />
    <path d="M -80 0 Q -60 -10 -50 20 Q -70 40 -85 20 Z" fill="#86efac" opacity="0.8" />

    <!-- Fluffy white swirl clouds on earth -->
    <path d="M -70 -20 Q -30 -30 10 -10 Q 50 10 80 -10" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M -40 40 Q 0 50 40 30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- Cute Sleepy Nightcap on Earth -->
    <path d="M -50 -80 Q 0 -130 70 -90 L 50 -60 Q 0 -80 -40 -60 Z" fill="#ec4899" />
    <circle cx="80" cy="-90" r="14" fill="#ffffff" />

    <!-- Sleepy Smiling Face on Planet Earth -->
    <path d="M -30 -10 Q -20 -2 -10 -10" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 10 -10 Q 20 -2 30 -10" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M -5 10 Q 0 16 5 10" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <ellipse cx="-25" cy="-2" rx="7" ry="4" fill="#fb7185" opacity="0.6" />
    <ellipse cx="25" cy="-2" rx="7" ry="4" fill="#fb7185" opacity="0.6" />
  </g>

  <!-- Floating Zzz's into the night -->
  <text x="420" y="240" font-family="'Fredoka', cursive, sans-serif" font-size="28" font-weight="bold" fill="#fef08a" opacity="0.9">Z</text>
  <text x="450" y="210" font-family="'Fredoka', cursive, sans-serif" font-size="22" font-weight="bold" fill="#fef08a" opacity="0.7">z</text>
  <text x="475" y="185" font-family="'Fredoka', cursive, sans-serif" font-size="16" font-weight="bold" fill="#fef08a" opacity="0.5">z</text>
</svg>
