<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="mountMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="forestNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="600" rx="32" fill="url(#skyGrad)" />

  <!-- Morning Sun -->
  <circle cx="300" cy="260" r="140" fill="url(#sunGlow)" />
  <circle cx="300" cy="260" r="48" fill="#fffbeb" />

  <!-- Sunbeams -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="2">
    <line x1="300" y1="260" x2="100" y2="80" stroke-width="4" stroke-linecap="round" />
    <line x1="300" y1="260" x2="500" y2="90" stroke-width="4" stroke-linecap="round" />
    <line x1="300" y1="260" x2="220" y2="60" stroke-width="3" />
    <line x1="300" y1="260" x2="380" y2="60" stroke-width="3" />
    <line x1="300" y1="260" x2="50" y2="200" stroke-width="3" />
    <line x1="300" y1="260" x2="550" y2="220" stroke-width="3" />
  </g>

  <!-- Distant Mountains -->
  <path d="M-50 420 L120 280 L280 390 L420 290 L650 430 L650 600 L-50 600 Z" fill="url(#mountFar)" />

  <!-- Mid-range Mountain Peaks -->
  <path d="M-20 460 L180 340 L340 430 L490 320 L620 460 L620 600 L-20 600 Z" fill="url(#mountMid)" opacity="0.8" />

  <!-- Morning Mist / Valley Fog -->
  <path d="M0 450 Q 150 420 300 440 T 600 430 L600 480 Q 450 470 300 480 T 0 490 Z" fill="#ffffff" opacity="0.35" />

  <!-- Forefront Pine Forest Silhouettes -->
  <path d="M-20 600 L-20 500 L15 460 L30 500 L55 450 L75 510 L110 440 L135 500 L180 430 L210 490 L260 410 L290 480 L340 430 L380 500 L430 420 L470 490 L520 440 L560 490 L620 430 L620 600 Z" fill="url(#forestNear)" />
  
  <!-- Secondary dense tree layer -->
  <path d="M0 600 L0 540 L40 510 L70 550 L120 490 L160 540 L210 480 L250 530 L310 470 L350 530 L410 490 L460 540 L510 480 L550 530 L600 490 L600 600 Z" fill="#090d16" />

  <!-- Little Morning Birds in Sky -->
  <path d="M140 180 Q 150 170 160 180 Q 170 170 180 180 Q 170 185 160 183 Q 150 185 140 180 Z" fill="#831843" opacity="0.6" />
  <path d="M190 150 Q 198 142 206 150 Q 214 142 222 150 Q 214 154 206 152 Q 198 154 190 150 Z" fill="#831843" opacity="0.5" />
  <path d="M230 190 Q 236 184 242 190 Q 248 184 254 190 Q 248 193 242 192 Q 236 193 230 190 Z" fill="#831843" opacity="0.5" />
</svg>
